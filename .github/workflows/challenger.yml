# Every day before the 12:00 deadline: forecast tomorrow with the challenger and save the average of
# the LSTM and the challenger in challenger.csv in the forecast-data branch (the live test, Step 15D).
# It runs after the daily forecast, because it needs the LSTM's forecast for tomorrow.
name: challenger

on:
  schedule:
    # cron-job.org starts this workflow at 11:30 Swedish time. This GitHub schedule is a backup:
    # 10:50 UTC = 11:50 Swedish winter time (12:50 in summer). A forecast made after 12:00 is saved
    # but never counted. The first forecast for each hour is never replaced.
    - cron: "50 10 * * *"
  workflow_dispatch:  # lets cron-job.org (and the "Run workflow" button) start it

permissions:
  contents: write  # to save challenger.csv in the forecast-data branch

# The same group as the other workflows, so they never write to the forecast-data branch at once
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Open the forecast-data branch in the live folder
        run: |
          git fetch --depth=1 origin forecast-data:forecast-data
          git worktree add live forecast-data

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install the exact package versions from uv.lock
        run: uv sync --locked

      # The token comes from the repository secret and is only given to this one step
      - name: Forecast tomorrow with the challenger
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: uv run python -m se3_electricity_forecast.challenger_live

      - name: Save the forecast in the forecast-data branch
        run: |
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenger.csv
          if git diff --cached --quiet; then
            echo "nothing new to save"
          else
            git commit -m "Challenger run $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push origin forecast-data
          fi
